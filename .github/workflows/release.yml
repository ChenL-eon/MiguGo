name: Build release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read pubspec version
        id: version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | cut -d+ -f1)
          if [ -z "$version" ]; then
            echo "::error::unable to read version from pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          EXPECTED_TAG: v${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec version $EXPECTED_TAG"
            exit 1
          fi

  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Set up NuGet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tooling/nuget | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile .tooling/nuget/nuget.exe
          Get-Item .tooling/nuget/nuget.exe | Format-List Name,Length
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package Windows build
        shell: pwsh
        run: |
          $zip = "MiguGo-${{ needs.prepare.outputs.version }}-windows-x64.zip"
          tar.exe -a -c -f $zip --exclude=*.pdb -C "build/windows/x64/runner/Release" .
          Get-Item $zip | Format-List Name,Length
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: MiguGo-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android release
        run: flutter build apk --release
      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk "MiguGo-${{ needs.prepare.outputs.version }}-android.apk"
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: MiguGo-*-android.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -f "dist/MiguGo-${VERSION}-windows-x64.zip"
          test -f "dist/MiguGo-${VERSION}-android.apk"
          ls -lh dist
      - name: Prepare release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          checksums=$(cd dist && sha256sum ./* | sed 's/^/    /')
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## 下载

          | 平台 | 文件 |
          | --- | --- |
          | Windows 10/11 x64 | MiguGo-${VERSION}-windows-x64.zip |
          | Android 7.0+ | MiguGo-${VERSION}-android.apk |

          ## 运行要求

          - Windows：Windows 10/11 x64，需要 WebView2 Runtime；解压整个目录后运行 MiguGo.exe。
          - Android：Android 7.0（API 24）及以上。

          ## 已知限制

          - Android 安装包使用调试证书签名，仅适合本机侧载。
          - 咪咕接口属于非官方公开网页接口，可能随时调整；登录与播放能力完全跟随咪咕账号权益，应用不提供任何绕过手段。
          - 仅支持在线流式播放，不下载、不保存音频文件。

          ## 校验

          ${checksums}
          EOF
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "MiguGo $tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
