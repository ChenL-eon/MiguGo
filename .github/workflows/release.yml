name: Build release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read pubspec version
        id: version
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | cut -d+ -f1)
          if [ -z "$version" ]; then
            echo "::error::unable to read version from pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          EXPECTED_TAG: v${{ steps.version.outputs.version }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$EXPECTED_TAG" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec version $EXPECTED_TAG"
            exit 1
          fi

  windows:
    name: Windows x64
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Set up NuGet
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tooling/nuget | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile .tooling/nuget/nuget.exe
          Get-Item .tooling/nuget/nuget.exe | Format-List Name,Length
      - name: Install dependencies
        run: flutter pub get
      - name: Build Windows release
        run: flutter build windows --release
      - name: Package Windows build
        shell: pwsh
        run: |
          $zip = "MiguGo-${{ needs.prepare.outputs.version }}-windows-x64.zip"
          tar.exe -a -c -f $zip --exclude=*.pdb -C "build/windows/x64/runner/Release" .
          Get-Item $zip | Format-List Name,Length
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          New-Item -ItemType Directory -Force build\installer | Out-Null
          & $iscc "/DAppVersion=${{ needs.prepare.outputs.version }}" "windows\installer\MiguGo.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC.exe failed with exit code $LASTEXITCODE" }
          $setup = "build\installer\MiguGo-${{ needs.prepare.outputs.version }}-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "installer not found: $setup" }
          Copy-Item $setup .
          Get-Item $setup | Format-List Name,Length
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            MiguGo-*-windows-x64.zip
            MiguGo-*-windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install Android SDK components
        # 运行镜像自带 Android SDK 与 cmdline-tools；setup-android@v3 会先去装早
        # 已被 Google 下架的 legacy `tools` 包，必然失败，所以直接用镜像里的 sdkmanager。
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Install dependencies
        run: flutter pub get
      - name: Build Android release
        run: flutter build apk --release --target-platform android-arm,android-arm64 --split-per-abi
      - name: Rename APKs
        run: |
          version="${{ needs.prepare.outputs.version }}"
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "MiguGo-${version}-android-arm64-v8a.apk"
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "MiguGo-${version}-android-armeabi-v7a.apk"
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: MiguGo-*-android-*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify assets
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          test -f "dist/MiguGo-${VERSION}-windows-x64.zip"
          test -f "dist/MiguGo-${VERSION}-windows-x64-setup.exe"
          test -f "dist/MiguGo-${VERSION}-android-arm64-v8a.apk"
          test -f "dist/MiguGo-${VERSION}-android-armeabi-v7a.apk"
          ls -lh dist
      - name: Prepare release notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          checksums=$(cd dist && sha256sum ./* | sed 's/^/    /')
          cat > "$RUNNER_TEMP/release-notes.md" <<EOF
          ## 下载

          | 平台 | 文件 |
          | --- | --- |
          | Windows 10/11 x64 | MiguGo-${VERSION}-windows-x64-setup.exe（安装版） |
          | Windows 10/11 x64 | MiguGo-${VERSION}-windows-x64.zip（免安装版） |
          | Android 7.0+ 64 位 | MiguGo-${VERSION}-android-arm64-v8a.apk（绝大多数手机） |
          | Android 7.0+ 32 位 | MiguGo-${VERSION}-android-armeabi-v7a.apk（老旧 32 位设备） |

          ## 运行要求

          - Windows：安装版双击 setup.exe 安装；免安装版解压整个目录后运行 MiguGo.exe。两者都需要 WebView2 Runtime。
          - Windows 安装版按当前用户安装，不需要管理员权限；卸载不会删除 %APPDATA%\cn.migulele\MiguGo 中的账号与设置。
          - Android：Android 7.0（API 24）及以上；请按手机架构选择 APK：64 位手机用 arm64-v8a，老旧 32 位设备用 armeabi-v7a；arm64 包装到 32 位机会无法安装。

          > Windows 安装包与程序暂未做代码签名，SmartScreen 可能提示「Windows 已保护你的电脑」。请先核对下方 SHA-256，再选择「更多信息 → 仍要运行」。

          ## 已知限制

          - Android 安装包使用调试证书签名，仅适合本机侧载。
          - 咪咕接口属于非官方公开网页接口，可能随时调整；登录与播放能力完全跟随咪咕账号权益，应用不提供任何绕过手段。
          - 仅支持在线流式播放，不下载、不保存音频文件。

          ## 校验

          ${checksums}
          EOF
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "MiguGo $tag" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
